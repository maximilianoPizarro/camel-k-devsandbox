apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: mcp
  labels:
    app.kubernetes.io/part-of: camel-k-workshop
    app.kubernetes.io/name: mcp
    workshop.camel-k/lab: "05-mcp"
spec:
  dependencies:
    - mvn:org.apache.camel.quarkus:camel-quarkus-ai-tool:3.39.0
    - mvn:org.apache.camel.quarkus:camel-quarkus-mcp-server:3.39.0
  sources:
    # >>> sources
    - name: SandboxTrust.java
      content: |
        import java.io.ByteArrayInputStream;
        import java.io.OutputStream;
        import java.nio.charset.StandardCharsets;
        import java.nio.file.Files;
        import java.nio.file.Path;
        import java.security.KeyStore;
        import java.security.cert.Certificate;
        import java.security.cert.CertificateFactory;

        import org.apache.camel.BindToRegistry;
        import org.apache.camel.support.jsse.KeyStoreParameters;
        import org.apache.camel.support.jsse.SSLContextParameters;
        import org.apache.camel.support.jsse.TrustManagersParameters;

        /**
         * Truststore for the OpenShift service CA mounted in every pod at
         * /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt.
         * The shared OpenShift AI predictors present a certificate signed by that CA.
         */
        @BindToRegistry("sandboxSsl")
        public class SandboxTrust extends SSLContextParameters {

            public SandboxTrust() {
                try {
                    String pem = Files.readString(Path.of("/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"));
                    CertificateFactory factory = CertificateFactory.getInstance("X.509");
                    char[] password = "changeit".toCharArray();
                    KeyStore store = KeyStore.getInstance("PKCS12");
                    store.load(null, password);
                    int index = 0;
                    for (Certificate certificate : factory.generateCertificates(
                            new ByteArrayInputStream(pem.getBytes(StandardCharsets.UTF_8)))) {
                        store.setCertificateEntry("service-ca-" + index++, certificate);
                    }
                    Path truststore = Path.of("/tmp/service-ca.p12");
                    try (OutputStream output = Files.newOutputStream(truststore)) {
                        store.store(output, password);
                    }
                    KeyStoreParameters parameters = new KeyStoreParameters();
                    parameters.setResource(truststore.toUri().toString());
                    parameters.setType("PKCS12");
                    parameters.setPassword("changeit");
                    TrustManagersParameters trust = new TrustManagersParameters();
                    trust.setKeyStore(parameters);
                    setTrustManagers(trust);
                } catch (Exception exception) {
                    throw new IllegalStateException("No se pudo cargar service-ca.crt", exception);
                }
            }
        }

    # <<< sources
  flows:
    # >>> flows
    # Paso 5. camel-mcp-server publica la ruta ai-tool en POST /mcp.
    # /ask llama la misma logica y le pide a Granite una frase.
    - route:
        id: order-status
        description: Estado de un pedido fijo del workshop
        from:
          uri: "direct:order-status"
          steps:
            - choice:
                when:
                  - simple: "${variable.orderId} == 'A-100'"
                    steps:
                      - setBody:
                          constant: "Pedido A-100 enviado desde Cordoba"
                  - simple: "${variable.orderId} == 'B-200'"
                    steps:
                      - setBody:
                          constant: "Pedido B-200 en preparacion en Rosario"
                  - simple: "${variable.orderId} == 'C-300'"
                    steps:
                      - setBody:
                          constant: "Pedido C-300 entregado en Mendoza"
                otherwise:
                  steps:
                    - setBody:
                        simple: "Pedido ${variable.orderId} no encontrado. Proba A-100, B-200 o C-300"
    - route:
        id: order-status-tool
        description: Herramienta MCP order-status
        from:
          uri: "ai-tool:order-status"
          parameters:
            tags: orders
            description: Estado de un pedido del catalogo del workshop
            parameter.orderId: string
            parameter.orderId.description: Id del pedido, por ejemplo A-100
            parameter.orderId.required: "true"
          steps:
            - setVariable:
                name: orderId
                simple: "${header.orderId}"
            - to: "direct:order-status"
    - route:
        id: ask
        description: Llama la herramienta y le pide a Granite una frase
        from:
          uri: "platform-http:/ask?httpMethodRestrict=GET"
          steps:
            - choice:
                when:
                  - simple: "${header.orderId} != null && ${header.orderId} != ''"
                    steps:
                      - setVariable:
                          name: orderId
                          simple: "${header.orderId}"
                otherwise:
                  steps:
                    - setVariable:
                        name: orderId
                        constant: "A-100"
            - to: "direct:order-status"
            - setVariable:
                name: question
                simple: "Redacta en una sola frase en espanol el estado de este pedido: ${body}"
            - removeHeaders:
                pattern: "CamelHttp*"
            - removeHeader:
                name: Host
            - setHeader:
                name: Authorization
                simple: "Bearer ${env:LLM_TOKEN}"
            - setHeader:
                name: Content-Type
                constant: application/json
            - setBody:
                simple: '{"model":"isvc-granite-31-8b-fp8","messages":[{"role":"user","content":"${variable.question}"}]}'
            - to: "https://isvc-granite-31-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1/chat/completions?httpMethod=POST&sslContextParameters=#sandboxSsl&bridgeEndpoint=true&throwExceptionOnFailure=false&responseTimeout=120000"
            - log: "modelo HTTP ${header.CamelHttpResponseCode}"
            - choice:
                when:
                  - simple: "${header.CamelHttpResponseCode} == 200"
                    steps:
                      - unmarshal:
                          json: {}
                      - setBody:
                          simple: "${body[choices][0][message][content]}"
                otherwise:
                  steps:
                    - setBody:
                        simple: "El modelo respondio HTTP ${header.CamelHttpResponseCode}: ${body}"
            - setHeader:
                name: Content-Type
                constant: "text/plain; charset=utf-8"
    # <<< flows
  traits:
    environment:
      vars:
        - LLM_TOKEN=secret:sandbox-llm-token/token
    route:
      enabled: true
      tlsTermination: edge
    container:
      expose: true
      requestCPU: "50m"
      requestMemory: "256Mi"
      limitCPU: "500m"
      limitMemory: "768Mi"
      runAsNonRoot: true
    deployer:
      kind: deployment
    deployment:
      progressDeadlineSeconds: 600
    builder:
      properties:
        - quarkus.camel.mcp-server.tags=orders
    camel:
      properties:
        - quarkus.mcp.server.server-info.name=camel-k-workshop
        - quarkus.mcp.server.http.root-path=/mcp
    logging:
      level: INFO
