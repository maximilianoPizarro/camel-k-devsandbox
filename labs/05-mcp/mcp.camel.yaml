# Paso 5. camel-mcp-server publica la ruta ai-tool en POST /mcp.
# /ask llama la misma logica y le pide a Granite una frase.
- route:
    id: order-status
    description: Estado de un pedido fijo del workshop
    from:
      uri: "direct:order-status"
      steps:
        - choice:
            when:
              - simple: "${variable.orderId} == 'A-100'"
                steps:
                  - setBody:
                      constant: "Pedido A-100 enviado desde Cordoba"
              - simple: "${variable.orderId} == 'B-200'"
                steps:
                  - setBody:
                      constant: "Pedido B-200 en preparacion en Rosario"
              - simple: "${variable.orderId} == 'C-300'"
                steps:
                  - setBody:
                      constant: "Pedido C-300 entregado en Mendoza"
            otherwise:
              steps:
                - setBody:
                    simple: "Pedido ${variable.orderId} no encontrado. Proba A-100, B-200 o C-300"
- route:
    id: order-status-tool
    description: Herramienta MCP order-status
    from:
      uri: "ai-tool:order-status"
      parameters:
        tags: orders
        description: Estado de un pedido del catalogo del workshop
        parameter.orderId: string
        parameter.orderId.description: Id del pedido, por ejemplo A-100
        parameter.orderId.required: "true"
      steps:
        - setVariable:
            name: orderId
            simple: "${header.orderId}"
        - to: "direct:order-status"
- route:
    id: ask
    description: Llama la herramienta y le pide a Granite una frase
    from:
      uri: "platform-http:/ask?httpMethodRestrict=GET"
      steps:
        - choice:
            when:
              - simple: "${header.orderId} != null && ${header.orderId} != ''"
                steps:
                  - setVariable:
                      name: orderId
                      simple: "${header.orderId}"
            otherwise:
              steps:
                - setVariable:
                    name: orderId
                    constant: "A-100"
        - to: "direct:order-status"
        - setVariable:
            name: question
            simple: "Redacta en una sola frase en espanol el estado de este pedido: ${body}"
        - removeHeaders:
            pattern: "CamelHttp*"
        - removeHeader:
            name: Host
        - setHeader:
            name: Authorization
            simple: "Bearer ${env:LLM_TOKEN}"
        - setHeader:
            name: Content-Type
            constant: application/json
        - setBody:
            simple: '{"model":"isvc-granite-31-8b-fp8","messages":[{"role":"user","content":"${variable.question}"}]}'
        - to: "https://isvc-granite-31-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1/chat/completions?httpMethod=POST&sslContextParameters=#sandboxSsl&bridgeEndpoint=true&throwExceptionOnFailure=false&responseTimeout=120000"
        - log: "modelo HTTP ${header.CamelHttpResponseCode}"
        - choice:
            when:
              - simple: "${header.CamelHttpResponseCode} == 200"
                steps:
                  - unmarshal:
                      json: {}
                  - setBody:
                      simple: "${body[choices][0][message][content]}"
            otherwise:
              steps:
                - setBody:
                    simple: "El modelo respondio HTTP ${header.CamelHttpResponseCode}: ${body}"
        - setHeader:
            name: Content-Type
            constant: "text/plain; charset=utf-8"
