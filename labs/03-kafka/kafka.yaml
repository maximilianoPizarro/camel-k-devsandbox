apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-start
  labels:
    app.kubernetes.io/part-of: camel-k-workshop
    app.kubernetes.io/name: kafka
    workshop.camel-k/lab: "03-kafka"
data:
  start.sh: |
    #!/bin/bash
    set -eu
    CONFIG=/tmp/server.properties
    DATA=/var/lib/kafka/data
    mkdir -p "$DATA" /tmp/logs
    cat > "$CONFIG" <<'EOF'
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@127.0.0.1:9093
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
    advertised.listeners=PLAINTEXT://kafka:9092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/var/lib/kafka/data
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
    num.partitions=1
    auto.create.topics.enable=true
    num.network.threads=2
    num.io.threads=2
    log.retention.hours=1
    EOF
    export LOG_DIR=/tmp/logs
    export KAFKA_HEAP_OPTS="${KAFKA_HEAP_OPTS:--Xms256m -Xmx384m}"
    if [[ ! -f "$DATA/meta.properties" ]]; then
      /opt/kafka/bin/kafka-storage.sh format -t "${CLUSTER_ID}" -c "$CONFIG" --ignore-formatted
    fi
    exec /opt/kafka/bin/kafka-server-start.sh "$CONFIG"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app.kubernetes.io/part-of: camel-k-workshop
    app.kubernetes.io/name: kafka
    workshop.camel-k/lab: "03-kafka"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/part-of: camel-k-workshop
        app.kubernetes.io/name: kafka
        workshop.camel-k/lab: "03-kafka"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: quay.io/strimzi/kafka:0.46.0-kafka-3.9.0
          command: ["bash", "/opt/workshop/start.sh"]
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
          env:
            - name: CLUSTER_ID
              value: O_vy5vtfTDm3AkkIwL6DoQ
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx384m"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: tmp
              mountPath: /tmp
            - name: start
              mountPath: /opt/workshop
          startupProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: start
          configMap:
            name: kafka-start
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/part-of: camel-k-workshop
    app.kubernetes.io/name: kafka
    workshop.camel-k/lab: "03-kafka"
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
