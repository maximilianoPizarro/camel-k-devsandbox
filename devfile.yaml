schemaVersion: 2.2.2
metadata:
  name: camel-k-workshop
  displayName: Camel K en Developer Sandbox
  description: Labs de Camel K para OpenShift Dev Spaces. Cada paso es una tarea del workspace.
  language: Java
  projectType: camel-k
  tags:
    - OpenShift
    - Camel
    - Kaoto
  attributes:
    controller.devfile.io/storage-type: ephemeral
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryRequest: 512Mi
      memoryLimit: 4Gi
      cpuRequest: 200m
      cpuLimit: "2"
      mountSources: true
      sourceMapping: /projects
commands:
  # --- Outer Loop: operador Camel K ---
  - id: paso-0-limpiar
    exec:
      component: tools
      commandLine: bash scripts/down.sh
      workingDir: ${PROJECT_SOURCE}
      label: Outer — Clean
      group:
        kind: run
        isDefault: false
  - id: paso-1-hello
    exec:
      component: tools
      commandLine: bash scripts/up.sh 01-hello
      workingDir: ${PROJECT_SOURCE}
      label: Outer — Hello
      group:
        kind: run
        isDefault: false
  - id: paso-2-http
    exec:
      component: tools
      commandLine: bash scripts/up.sh 02-http
      workingDir: ${PROJECT_SOURCE}
      label: Outer — HTTP
      group:
        kind: run
        isDefault: false
  - id: paso-3-kafka
    exec:
      component: tools
      commandLine: bash scripts/up.sh 03-kafka
      workingDir: ${PROJECT_SOURCE}
      label: Outer — Kafka
      group:
        kind: run
        isDefault: false
  - id: paso-4-granite
    exec:
      component: tools
      commandLine: bash scripts/up.sh 04-granite
      workingDir: ${PROJECT_SOURCE}
      label: Outer — Granite
      group:
        kind: run
        isDefault: false
  - id: paso-5-mcp
    exec:
      component: tools
      commandLine: bash scripts/up.sh 05-mcp
      workingDir: ${PROJECT_SOURCE}
      label: Outer — MCP
      group:
        kind: run
        isDefault: false

  # --- Inner Loop: Camel JBang (mismo *.camel.yaml, sin Integration) ---
  # El source scripts/install-jbang.sh instala JBang + Camel CLI 4.22.0
  # la primera vez; despues es instantaneo. El comando camel run que sigue
  # es el que copies a cualquier terminal.
  - id: local-hello
    exec:
      component: tools
      commandLine: >-
        source scripts/install-jbang.sh &&
        camel run labs/01-hello/hello.camel.yaml
        --java-version=17 --jvm-args=-Xmx1024m
      workingDir: ${PROJECT_SOURCE}
      label: "Inner — Hello"
      group:
        kind: run
        isDefault: false
  - id: local-http
    exec:
      component: tools
      commandLine: >-
        source scripts/install-jbang.sh &&
        camel run labs/02-http/hello.camel.yaml
        --java-version=17 --jvm-args=-Xmx1024m --port=8081
      workingDir: ${PROJECT_SOURCE}
      label: "Inner — HTTP"
      group:
        kind: run
        isDefault: false
  - id: local-kafka
    exec:
      component: tools
      commandLine: >-
        source scripts/install-jbang.sh &&
        oc apply -f labs/03-kafka/kafka.yaml &&
        oc rollout status deployment/kafka --timeout=300s &&
        camel run labs/03-kafka/orders.camel.yaml
        --java-version=17 --jvm-args=-Xmx1024m
      workingDir: ${PROJECT_SOURCE}
      label: "Inner — Kafka"
      group:
        kind: run
        isDefault: false
  - id: local-granite
    exec:
      component: tools
      commandLine: >-
        source scripts/install-jbang.sh &&
        export LLM_TOKEN=$(oc whoami -t) &&
        camel run labs/04-granite/ask.camel.yaml platform/SandboxTrust.java
        --java-version=17 --jvm-args=-Xmx1024m --port=8081
      workingDir: ${PROJECT_SOURCE}
      label: "Inner — Granite"
      group:
        kind: run
        isDefault: false
  - id: local-mcp
    exec:
      component: tools
      commandLine: >-
        source scripts/install-jbang.sh &&
        export LLM_TOKEN=$(oc whoami -t) &&
        camel run labs/05-mcp/mcp.camel.yaml platform/SandboxTrust.java
        --runtime=quarkus
        --dep=org.apache.camel.quarkus:camel-quarkus-ai-tool:3.39.0
        --dep=org.apache.camel.quarkus:camel-quarkus-mcp-server:3.39.0
        --property=quarkus.camel.mcp-server.tags=orders
        --property=quarkus.mcp.server.server-info.name=camel-k-workshop
        --property=quarkus.mcp.server.http.root-path=/mcp
        --java-version=17 --jvm-args=-Xmx1024m --port=8081
      workingDir: ${PROJECT_SOURCE}
      label: "Inner — MCP"
      group:
        kind: run
        isDefault: false
  - id: local-stop
    exec:
      component: tools
      commandLine: >-
        export PATH="${HOME}/.jbang/bin:${PATH}";
        camel stop 2>/dev/null || true;
        echo "Proceso local detenido."
      workingDir: ${PROJECT_SOURCE}
      label: "Inner — Stop"
      group:
        kind: run
        isDefault: false

  # --- utilidad ---
  - id: estado
    exec:
      component: tools
      commandLine: bash scripts/status.sh
      workingDir: ${PROJECT_SOURCE}
      label: Estado del proyecto
      group:
        kind: test
        isDefault: false
