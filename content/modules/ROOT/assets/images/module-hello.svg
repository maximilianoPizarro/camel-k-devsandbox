<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
    <rect width="800" height="450" fill="#1a1a1a"/>
    <defs>
        <style>
            text { font-family: 'Red Hat Display', 'Open Sans', sans-serif; fill: #ffffff; }
            .title { font-size: 24px; font-weight: bold; }
            .subtitle { font-size: 16px; fill: #cccccc; }
            .box { fill: #2b2b2b; stroke: #444444; stroke-width: 2; rx: 8; }
            .box-red { fill: #2b2b2b; stroke: #EE0000; stroke-width: 2; rx: 8; }
            .box-yellow { fill: #2b2b2b; stroke: #FFDD00; stroke-width: 2; rx: 8; }
            .arrow { stroke: #FFDD00; stroke-width: 3; fill: none; }
            .arrow-head { fill: #FFDD00; }
            .arrow-green { stroke: #3E8635; stroke-width: 3; fill: none; }
            .arrow-head-green { fill: #3E8635; }
            .label { font-size: 14px; text-anchor: middle; }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
        </marker>
        <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-head-green" />
        </marker>
    </defs>
    
    <text x="400" y="50" class="title" text-anchor="middle">Module: Hello World</text>
    <image x="650" y="30" width="100" height="50" href="data:image/svg+xml;base64,"/>
    
    
    <rect x="100" y="150" width="150" height="100" class="box"/>
    <text x="175.0" y="180" class="label" font-weight="bold">timer:tick</text>
    
    <text x="175" y="210" class="label" fill="#cccccc">period=10s</text>
    
    <line x1="250" y1="200" x2="340" y2="200" class="arrow" marker-end="url(#arrowhead)"/>
    
    
    <rect x="350" y="150" width="150" height="100" class="box"/>
    <text x="425.0" y="180" class="label" font-weight="bold">setBody</text>
    
    <text x="425" y="210" class="label" fill="#cccccc">"Hola desde Camel K"</text>
    
    <line x1="500" y1="200" x2="590" y2="200" class="arrow" marker-end="url(#arrowhead)"/>
    
    
    <rect x="600" y="150" width="150" height="100" class="box"/>
    <text x="675.0" y="180" class="label" font-weight="bold">log</text>
    
    <text x="675" y="210" class="label" fill="#cccccc">Writes to stdout</text>

</svg>