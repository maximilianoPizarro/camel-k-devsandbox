---
site:
  title: Red Hat Apache Camel Day Roadshow
  url: https://maximilianopizarro.github.io/camel-k-devsandbox
  start_page: camel-day-roadshow::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/dialvare/rhdp_showroom_theme/releases/download/v2.0.4-ops/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www

asciidoc:
  attributes:
    toclevels: 2
